<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ESP32 Smart Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="header">
    <h2>ESP32 Smart Dashboard</h2>
    <button id="themeToggle" class="theme-button" onclick="toggleTheme()">☀️</button>
  </div>

  <div class="gauges">
    <div>
      <h3>Temperature</h3>
      <div class="gauge"><div id="tempNeedle" class="needle"></div></div>
      <div id="tempValue">-- °C</div>
    </div>
    <div>
      <h3>Humidity</h3>
      <div class="gauge"><div id="humNeedle" class="needle"></div></div>
      <div id="humValue">-- %</div>
    </div>
  </div>

  <h3>Motion Sensor</h3>
  <div id="motionCircle" class="circle"></div>

  <h3>Controls</h3>
  <button class="button" onclick="toggleLED()">Toggle LED</button>
  <button class="button" onclick="activateBuzzer()">Buzz</button>

  <script src="script.js"></script>
</body>
</html>
