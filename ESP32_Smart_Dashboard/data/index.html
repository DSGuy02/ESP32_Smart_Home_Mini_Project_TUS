<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ESP32 Smart Dashboard</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h2>ESP32 Smart Dashboard</h2>
    <div class="right-controls">
      <button id="themeToggle" class="theme-button" onclick="toggleTheme()">☀️</button>
    </div>
  </header>

  <main class="container">
    <section class="top-row">
      <div class="card gauge-card">
        <h3>Temperature</h3>
        <div class="gauge"><div id="tempNeedle" class="needle"></div></div>
        <p id="tempValue">-- °C</p>
      </div>

      <div class="card gauge-card">
        <h3>Humidity</h3>
        <div class="gauge"><div id="humNeedle" class="needle"></div></div>
        <p id="humValue">-- %</p>
      </div>
    </section>

    <section class="middle-row">
      <div class="card motion-card">
        <h3>Motion Sensor</h3>
        <div id="motionCircle" class="circle" title="Click 5 times to toggle dummy mode"></div>
        <p id="motionStatus">No motion</p>
      </div>

      <div class="card control-card">
        <h3>Controls</h3>
        <div class="control-item">
          <div class="control-row">
            <button class="button" id="ledToggleBtn">Toggle LED</button>
            <div class="small-info" id="ledStatus">LED: OFF</div>
          </div>
          <div class="control-row">
            <input id="ledDuration" class="duration-input" type="number" min="1" placeholder="seconds">
            <button class="button" id="ledTimedBtn">LED for time</button>
          </div>
        </div>

        <div class="control-item">
          <div class="control-row">
            <button class="button" id="buzzBtn">Buzz</button>
            <div class="small-info" id="buzzerStatus">Buzzer: OFF</div>
          </div>
          <div class="control-row">
            <input id="freqInput" class="small-input" type="number" min="37" max="20000" value="1000">
            <input id="durInput" class="small-input" type="number" min="10" max="60000" value="500">
            <button class="button" id="buzzCustomBtn">Buzz (custom)</button>
          </div>
        </div>
      </div>
    </section>

    <footer class="footer-note">
      <!-- <small>Hidden: click the motion circle 5 times quickly to toggle simulated (dummy) sensor readings.</small> -->
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
